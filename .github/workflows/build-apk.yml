name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release APK Assets
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/CarromDualScreen-v1.0.${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/*.apk release-apks/CarromDualScreen-v1.0.${{ github.run_number }}-release-unsigned.apk
          ls -lh release-apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarromDualScreen-Debug-APK
          path: release-apks/*-debug.apk

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarromDualScreen-Release-Unsigned-APK
          path: release-apks/*-release-unsigned.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" release-apks/*.apk \
            --title "Carrom Dual Screen $TAG" \
            --notes "Automated Native Android APK build (Debug + Unsigned Release) for Carrom Dual Screen (minSdk 26 / targetSdk 34, Kotlin)." \
            --latest
