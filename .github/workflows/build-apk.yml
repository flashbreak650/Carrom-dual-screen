name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK Licenses & Platform 34
        run: |
          SDK_MANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release APK Assets
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/CarromDualScreen-v1.0.${{ github.run_number }}-signed.apk
          ls -lh release-apks/

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarromDualScreen-Signed-APK
          path: release-apks/*-signed.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" release-apks/*-signed.apk \
            --title "Carrom Dual Screen $TAG" \
            --notes "Signed installable Native Android APK for Carrom Dual Screen (minSdk 26 / targetSdk 34, Kotlin) with 1-Tap Auto Split-Screen support." \
            --latest
